
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F8F6F1">
    <title>Gravity Marketing | Navigation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-navy: #0D1527;
            --color-background: #F8F6F1;
            --color-coral: #FF5A3D;
            --color-lime: #D9FF45;
            --color-purple: #7955F5;
            --color-text: #111827;
            --color-text-muted: #5B6472;
            --color-white: #FFFFFF;
            --color-border: #E7E5E0;
            --color-coral-light: #FFE8E1;
            --color-purple-light: #EEE9FF;
            --color-lime-light: #F2F9D9;

            --ease-out: cubic-bezier(.16, 1, .3, 1);
            --nav-shadow: 0 16px 45px rgba(13, 21, 39, .14);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background:
                radial-gradient(ellipse at 10% 0%, rgba(217,255,69,.13), transparent 32%),
                radial-gradient(ellipse at 95% 10%, rgba(121,85,245,.10), transparent 30%),
                var(--color-background);
            color: var(--color-text);
            font-family: 'Inter', sans-serif;
        }

        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* Ambient background decoration */

        .ambient {
            position: fixed;
            z-index: -1;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            filter: blur(75px);
            opacity: .23;
            pointer-events: none;
            animation: ambient-drift 12s ease-in-out infinite alternate;
        }

        .ambient-one {
            top: 12%;
            left: -130px;
            background: var(--color-coral);
        }

        .ambient-two {
            right: -130px;
            bottom: 8%;
            background: var(--color-purple);
            animation-delay: -5s;
        }

        /* Navigation container */

        .nav-pill-container {
            position: relative;
            isolation: isolate;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            width: 100%;
            max-width: 1100px;
            min-height: 76px;
            padding: 12px 16px 12px 24px;
            color: var(--color-white);
            background: var(--color-navy);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 999px;
            box-shadow: var(--nav-shadow);

            opacity: 0;
            transform: translateY(-30px) scale(.94);
            filter: blur(5px);
            transition:
                opacity 1s var(--ease-out),
                transform 1.1s var(--ease-out),
                filter 1s var(--ease-out),
                box-shadow .4s ease;
            will-change: transform, opacity;
        }

        .nav-pill-container::before {
            content: "";
            position: absolute;
            inset: 1px;
            z-index: -1;
            border-radius: inherit;
            background: linear-gradient(
                120deg,
                rgba(255,255,255,.045),
                transparent 45%,
                rgba(121,85,245,.08)
            );
            pointer-events: none;
        }

        .nav-pill-container.loaded {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        .nav-pill-container.loaded:hover {
            box-shadow: 0 22px 55px rgba(13,21,39,.19);
        }

        /* Logo */


        /* Stylish Gravity Logo Hover Animation */

        .brand {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            text-decoration: none;
            border-radius: 12px;

            transform-origin: left center;

            transition:
                transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                filter 0.45s ease;
        }

        .brand img {
            display: block;
            width: 118px;
            height: 44px;
            object-fit: contain;
            object-position: left center;

            transition:
                transform 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                filter 0.45s ease;
        }

        /* Zoom in with a smooth, spring-like finish */
        .brand:hover {
            transform: scale(1.13);
            filter: drop-shadow(0 5px 12px rgba(255, 90, 61, 0.18));
        }

        .brand:hover img {
            transform: scale(1.04);
            filter:
                drop-shadow(0 0 5px rgba(255, 90, 61, 0.65))
                drop-shadow(0 0 14px rgba(121, 85, 245, 0.28));
        }

        /* Mouse press feedback */
        .brand:active {
            transform: scale(1.06);
            transition-duration: 0.12s;
        }

        /* Keyboard accessibility */
        .brand:focus-visible {
            outline: 2px solid var(--color-lime);
            outline-offset: 5px;
        }


        /* Desktop links */

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(16px, 2.4vw, 32px);
        }

        .nav-link {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 10px 0;
            color: #D1D5DB;
            text-decoration: none;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 500;
            transition: color .3s ease;
        }

        .nav-link::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: 3px;
            left: 0;
            height: 2px;
            border-radius: 10px;
            background: var(--color-lime);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .4s var(--ease-out);
        }

        .nav-link:hover,
        .nav-link:focus-visible,
        .nav-link[aria-current="page"] {
            color: var(--color-white);
        }

        .nav-link:hover::after,
        .nav-link:focus-visible::after,
        .nav-link[aria-current="page"]::after {
            transform: scaleX(1);
        }

        /* Reveal animation and stagger */

        .nav-item-reveal {
            opacity: 0;
            transform: translateY(-12px) scale(.96);
            transition:
                opacity .8s var(--ease-out),
                transform .9s var(--ease-out);
            transition-delay: var(--delay, 0s);
        }

        .loaded .nav-item-reveal {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .delay-1 { --delay: .15s; }
        .delay-2 { --delay: .25s; }
        .delay-3 { --delay: .35s; }
        .delay-4 { --delay: .45s; }
        .delay-5 { --delay: .55s; }
        .delay-6 { --delay: .65s; }
        .delay-7 { --delay: .75s; }

        /* CTA button */

        .cta-button {
            position: relative;
            isolation: isolate;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 46px;
            padding: 0 22px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 999px;
            background: var(--color-coral);
            color: var(--color-white);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .025em;
            text-decoration: none;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(255,90,61,.20);
            transition:
                background .3s ease,
                color .3s ease,
                transform .35s var(--ease-out),
                box-shadow .35s ease;
        }

        .cta-button::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: var(--color-lime);
            transform: translateX(-105%) skewX(-15deg);
            transition: transform .5s var(--ease-out);
        }

        .cta-button:hover {
            color: var(--color-navy);
            transform: translateY(-3px);
            box-shadow: 0 12px 26px rgba(255,90,61,.28);
        }

        .cta-button:hover::before {
            transform: translateX(0) skewX(0);
        }

        .cta-button:active {
            transform: translateY(-1px) scale(.98);
        }

        .cta-arrow {
            display: inline-block;
            font-size: 16px;
            transition: transform .35s var(--ease-out);
        }

        .cta-button:hover .cta-arrow {
            transform: translate(3px, -3px);
        }

        /* Mobile menu */

        .menu-toggle {
            display: none;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 50%;
            background: rgba(255,255,255,.06);
            cursor: pointer;
        }

        .menu-toggle span {
            display: block;
            width: 18px;
            height: 2px;
            border-radius: 4px;
            background: var(--color-white);
            transition:
                transform .3s ease,
                opacity .2s ease;
        }

        .menu-toggle[aria-expanded="true"] span:first-child {
            transform: translateY(3.5px) rotate(45deg);
        }

        .menu-toggle[aria-expanded="true"] span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle[aria-expanded="true"] span:last-child {
            transform: translateY(-3.5px) rotate(-45deg);
        }

        .mobile-menu {
            display: none;
        }

        /* Demo content: remove when integrating into your actual site */

        .demo-content {
            width: 100%;
            max-width: 1000px;
            margin-top: 110px;
            text-align: center;
            animation: content-reveal 1.1s .5s var(--ease-out) both;
        }

        .demo-eyebrow {
            color: var(--color-purple);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .demo-content h1 {
            max-width: 760px;
            margin: 18px auto;
            font-size: clamp(38px, 7vw, 76px);
            line-height: 1.06;
            letter-spacing: -.065em;
        }

        .demo-content h1 span {
            display: inline-block;
            color: var(--color-coral);
        }

        .demo-content p {
            max-width: 540px;
            margin: 0 auto;
            color: var(--color-text-muted);
            font-size: 16px;
            line-height: 1.8;
        }

        .demo-badges {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 28px;
        }

        .demo-badge {
            padding: 10px 15px;
            border: 1px solid var(--color-border);
            border-radius: 999px;
            background: rgba(255,255,255,.65);
            font-size: 12px;
            font-weight: 600;
        }

        .demo-badge:nth-child(2) {
            background: var(--color-lime-light);
        }

        .demo-badge:nth-child(3) {
            background: var(--color-purple-light);
        }

        /* Keyframes */

        @keyframes content-reveal {
            from {
                opacity: 0;
                transform: translateY(28px);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes ambient-drift {
            from {
                transform: translate3d(0, 0, 0) scale(1);
            }
            to {
                transform: translate3d(35px, -25px, 0) scale(1.12);
            }
        }

        /* Responsive */

        @media (max-width: 760px) {
            body {
                padding: 20px 14px;
            }

            .nav-pill-container {
                min-height: 68px;
                padding: 10px 12px 10px 18px;
                gap: 12px;
                border-radius: 24px;
            }

            .brand img {
                width: 106px;
                height: 40px;
            }

            .nav-links,
            .desktop-cta {
                display: none;
            }

            .menu-toggle {
                display: flex;
            }

            .mobile-menu {
                position: absolute;
                top: calc(100% + 12px);
                right: 0;
                left: 0;
                display: flex;
                flex-direction: column;
                gap: 4px;
                padding: 12px;
                border: 1px solid rgba(255,255,255,.1);
                border-radius: 22px;
                background: var(--color-navy);
                box-shadow: var(--nav-shadow);

                opacity: 0;
                visibility: hidden;
                transform: translateY(-8px) scale(.98);
                transform-origin: top;
                transition:
                    opacity .3s ease,
                    transform .3s var(--ease-out),
                    visibility .3s ease;
            }

            .mobile-menu.open {
                opacity: 1;
                visibility: visible;
                transform: translateY(0) scale(1);
            }

            .mobile-menu .nav-link {
                padding: 13px 12px;
                font-size: 14px;
            }

            .mobile-menu .nav-link::after {
                right: auto;
                bottom: 5px;
                left: 12px;
                width: 32px;
            }

            .mobile-menu .cta-button {
                margin-top: 8px;
            }

            .demo-content {
                margin-top: 90px;
            }

            .demo-content p {
                font-size: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                transition-delay: 0ms !important;
            }

            .nav-pill-container,
            .nav-item-reveal {
                opacity: 1;
                transform: none;
                filter: none;
            }
        }
    </style>
</head>

<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <nav class="nav-pill-container" id="navbar" aria-label="Main navigation">

        <!-- Logo: uses your transparent PNG -->
        <a href="/" class="brand nav-item-reveal delay-1"
           aria-label="Gravity Marketing home">
            <img
                src="grav_market_testimonial_images/logo.png"
                alt="Gravity Marketing"
                width="118"
                height="44"
                fetchpriority="high"
            >
        </a>

        <!-- Desktop navigation -->
        <div class="nav-links" id="desktopLinks">
            <a href="/" class="nav-link nav-item-reveal delay-2"
               aria-current="page">Home</a>

            <a href="/about-page/"
               class="nav-link nav-item-reveal delay-3">About</a>

            <a href="/career/"
               class="nav-link nav-item-reveal delay-4">Career</a>

            <a href="/contact-us/"
               class="nav-link nav-item-reveal delay-5">Contact Us</a>

            <a href="/testimonials/"
               class="nav-link nav-item-reveal delay-6">Testimonials</a>
        </div>

        <!-- Desktop CTA -->
        <div class="desktop-cta nav-item-reveal delay-7">
            <a href="/contact-us/" class="cta-button">
                Book a Call
                <span class="cta-arrow" aria-hidden="true">↗</span>
            </a>
        </div>

        <!-- Mobile menu button -->
        <button
            class="menu-toggle"
            id="menuToggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="mobileMenu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Mobile navigation -->
        <div class="mobile-menu" id="mobileMenu" inert>
            <a href="/" class="nav-link" aria-current="page">Home</a>
            <a href="/about-page/" class="nav-link">About</a>
            <a href="/career/" class="nav-link">Career</a>
            <a href="/contact-us/" class="nav-link">Contact Us</a>
            <a href="/testimonials/" class="nav-link">Testimonials</a>

            <a href="/contact-us/" class="cta-button">
                Book a Call <span class="cta-arrow" aria-hidden="true">↗</span>
            </a>
        </div>
    </nav>

    <script>
        (() => {
            const navbar = document.getElementById('navbar');
            const menuToggle = document.getElementById('menuToggle');
            const mobileMenu = document.getElementById('mobileMenu');

            // Entrance animation, triggered after initial rendering.
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    navbar.classList.add('loaded');
                });
            });

            function setMenuOpen(open) {
                menuToggle.setAttribute('aria-expanded', String(open));
                menuToggle.setAttribute(
                    'aria-label',
                    open ? 'Close navigation menu' : 'Open navigation menu'
                );

                mobileMenu.classList.toggle('open', open);
                mobileMenu.inert = !open;
            }

            menuToggle.addEventListener('click', () => {
                const isOpen =
                    menuToggle.getAttribute('aria-expanded') === 'true';

                setMenuOpen(!isOpen);
            });

            // Close after choosing a destination.
            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => setMenuOpen(false));
            });

            // Close when clicking outside the navigation.
            document.addEventListener('click', event => {
                if (!navbar.contains(event.target)) {
                    setMenuOpen(false);
                }
            });

            // Close with Escape for keyboard users.
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') {
                    setMenuOpen(false);
                    menuToggle.focus();
                }
            });

            // Reset mobile navigation when returning to desktop width.
            window.addEventListener('resize', () => {
                if (window.innerWidth > 760) {
                    setMenuOpen(false);
                }
            });
        })();
    </script>
</body>
</html>
