        // 7 distinct color gradient themes
        const colorThemes = [
            "from-emerald-600 via-teal-700 to-emerald-900",    // 1. Emerald Teal
            "from-amber-600 via-orange-600 to-amber-900",     // 2. Amber Orange
            "from-blue-600 via-indigo-700 to-blue-900",       // 3. Royal Blue
            "from-rose-600 via-pink-600 to-rose-900",         // 4. Rose Pink
            "from-purple-600 via-violet-700 to-purple-900",   // 5. Purple Violet
            "from-cyan-600 via-sky-700 to-cyan-900",         // 6. Cyan Sky
            "from-fuchsia-600 via-magenta-700 to-pink-900"   // 7. Fuchsia Magenta
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('cards-container');

            // Render all 28 cards
            container.innerHTML = testimonials.map((item, index) => {
                const isLast = index === testimonials.length - 1;
                const themeClass = colorThemes[index % colorThemes.length]; // Cycles through the 7 colors

                return `
                    <article class="card-wrapper sticky top-4 md:top-10 h-[90vh] md:h-[100vh] w-full flex items-start justify-center pt-4 md:pt-10 ${isLast ? '' : 'mb-[10vh]'}">
                        <div class="inner-card w-full h-[80vh] md:h-[85vh] rounded-[2rem] md:rounded-[3rem] overflow-hidden relative shadow-2xl transition-all duration-100 ease-out origin-top will-change-transform">
                            <!-- Background Color Gradient -->
                            <div class="absolute inset-0 bg-gradient-to-br ${themeClass}"></div>
                            
                            <!-- Dark Gradient overlay for text contrast -->
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
                            
                            <!-- Card Content -->
                            <div class="absolute bottom-0 left-0 p-8 md:p-14 w-full md:w-3/4 lg:w-2/3 text-white">
                                <span class="inline-block px-4 py-1.5 bg-white/20 backdrop-blur-md rounded-full text-sm font-semibold tracking-wide mb-6 border border-white/30">
                                    Client Testimonial #${index + 1}
                                </span>
                                <h2 class="text-2xl md:text-4xl lg:text-5xl font-bold mb-6 leading-tight">
                                    "${item.quote}"
                                </h2>
                                <div class="flex flex-col">
                                    <span class="font-bold text-lg md:text-xl">${item.name}</span>
                                    <span class="text-white/80 text-sm md:text-base">${item.role}</span>
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');

            // JavaScript logic for smooth scaling and dimming as cards stack
            const wrappers = document.querySelectorAll('.card-wrapper');
            const getStickyOffset = () => window.innerWidth >= 768 ? 40 : 16;

            window.addEventListener('scroll', () => {
                const stickyOffset = getStickyOffset();
                
                wrappers.forEach((wrapper, index) => {
                    const rect = wrapper.getBoundingClientRect();
                    const innerCard = wrapper.querySelector('.inner-card');
                    
                    // Check if card reached sticky position
                    if (rect.top <= stickyOffset + 5) {
                        const nextWrapper = wrappers[index + 1];
                        
                        if (nextWrapper) {
                            const nextRect = nextWrapper.getBoundingClientRect();
                            const totalTravelDistance = window.innerHeight - stickyOffset;
                            const distanceToSticky = nextRect.top - stickyOffset;
                            
                            let progress = 1 - (distanceToSticky / totalTravelDistance);
                            progress = Math.max(0, Math.min(1, progress));
                            
                            // Scale down to 0.92 and dim brightness to 0.4
                            const scale = 1 - (0.08 * progress);
                            const brightness = 1 - (0.6 * progress);
                            
                            innerCard.style.transform = `scale(${scale})`;
                            innerCard.style.filter = `brightness(${brightness})`;
                        }
                    } else {
                        // Reset when scrolled back
                        innerCard.style.transform = 'scale(1)';
                        innerCard.style.filter = 'brightness(1)';
                    }
                });
            }, { passive: true });
        });
